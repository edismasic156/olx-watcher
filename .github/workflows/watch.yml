name: OLX Mac mini watcher

on:
  schedule:
    - cron: "*/5 * * * *"    # svakih 5 min (GitHub zna kasniti 5-15 min)
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Pošalji test notifikaciju"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provjeri OLX
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python watcher.py
      - name: Sačuvaj viđene oglase
        run: |
          git config user.name "olx-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen [skip ci]"
          git push
